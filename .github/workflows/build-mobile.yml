name: Build Camille Mobile (APK)

on:
  workflow_dispatch: {}
  push:
    branches:
      - claude/zealous-ramanujan-wgSVV
    paths:
      - "mobile/**"
      - ".github/workflows/build-mobile.yml"

jobs:
  android-apk:
    runs-on: ubuntu-latest
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java (Temurin 17)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies (locked)
        run: npm ci --no-audit --no-fund

      - name: Expo prebuild (generate android/)
        run: npx expo prebuild --platform android --clean
        env:
          CI: "1"

      - name: Ensure splash color resource (garantie anti-AAPT)
        run: |
          F=android/app/src/main/res/values/colors.xml
          if [ -f "$F" ] && ! grep -q "splashscreen_background" "$F"; then
            sed -i 's|</resources>|  <color name="splashscreen_background">#ECECEC</color>\n</resources>|' "$F"
            echo "Injected splashscreen_background into colors.xml"
          fi
          grep -n "splashscreen_background" "$F" || echo "WARN: color still missing"

      - name: Gradle build (assembleRelease)
        working-directory: mobile/android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Locate APK
        id: apk
        run: |
          APK=$(find . -path '*/apk/release/*.apk' | head -n1)
          echo "Found APK: $APK"
          echo "path=mobile/$APK" >> "$GITHUB_OUTPUT"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: camille-mobile-apk
          path: mobile/android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30

      # Publie la mise a jour OTA APRES l'upload de l'APK : meme si cette etape
      # echoue (secret absent, reseau), l'APK reste disponible en artifact.
      - name: Publier la mise a jour OTA (EAS Update)
        if: env.EXPO_TOKEN != ''
        continue-on-error: true
        working-directory: mobile
        run: npx eas-cli@latest update --branch production --message "build ${{ github.sha }}" --non-interactive
