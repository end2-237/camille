name: Build Camille Mobile (APK + AAB)

on:
  workflow_dispatch: {}
  push:
    branches:
      - claude/zealous-ramanujan-wgSVV
    paths:
      - "mobile/**"
      - ".github/workflows/build-mobile.yml"

jobs:
  android-apk:
    runs-on: ubuntu-latest
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java (Temurin 17)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies (locked)
        run: npm ci --no-audit --no-fund

      - name: Expo prebuild (generate android/)
        run: npx expo prebuild --platform android --clean
        env:
          CI: "1"

      - name: Ensure splash color resource (garantie anti-AAPT)
        run: |
          F=android/app/src/main/res/values/colors.xml
          if [ -f "$F" ] && ! grep -q "splashscreen_background" "$F"; then
            sed -i 's|</resources>|  <color name="splashscreen_background">#ECECEC</color>\n</resources>|' "$F"
            echo "Injected splashscreen_background into colors.xml"
          fi
          grep -n "splashscreen_background" "$F" || echo "WARN: color still missing"

      # Cle de signature de production. Sans le secret, le build continue et
      # retombe sur la cle de debug : un fork ou un test ne doit pas casser.
      - name: Restaurer la cle de signature
        id: signing
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KS" ]; then
            echo "Aucun secret ANDROID_KEYSTORE_BASE64 — build signe avec la cle de DEBUG."
            echo "signed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Un secret colle depuis Windows arrive avec des retours chariot, et
          # « base64 -w0 » n est pas toujours utilise : on retire tout espace
          # avant de decoder, plutot que d echouer sur « invalid input ».
          KEYSTORE=android/app/camille-release.keystore
          printf '%s' "$KS" | tr -d '[:space:]' | base64 -d > "$KEYSTORE" 2>/dev/null || true

          # Un keystore commence par FEEDFEED (JKS) ou 30 (PKCS#12). Sans ce
          # controle, un secret invalide donne un fichier vide, et l echec
          # n apparait que 10 minutes plus tard dans Gradle, illisible.
          MAGIC=$(head -c 4 "$KEYSTORE" | od -An -tx1 | tr -d ' \n')
          case "$MAGIC" in
            feedfeed*|30*) ;;
            *)
              echo "::error::ANDROID_KEYSTORE_BASE64 ne contient pas un keystore valide."
              echo "Regenere le secret avec :  base64 -w0 camille-release.keystore"
              echo "puis colle le resultat SANS retour a la ligne ni espace."
              rm -f "$KEYSTORE"
              exit 1
              ;;
          esac
          echo "Keystore restaure ($(stat -c%s "$KEYSTORE") octets)."
          echo "signed=true" >> "$GITHUB_OUTPUT"

      - name: Gradle build (assembleRelease)
        working-directory: mobile/android
        env:
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x ./gradlew
          if [ "${{ steps.signing.outputs.signed }}" = "true" ]; then
            ./gradlew assembleRelease --no-daemon \
              -PCAMILLE_STORE_FILE=camille-release.keystore \
              -PCAMILLE_STORE_PASSWORD="$STORE_PASSWORD" \
              -PCAMILLE_KEY_ALIAS="${KEY_ALIAS:-camille}" \
              -PCAMILLE_KEY_PASSWORD="${KEY_PASSWORD:-$STORE_PASSWORD}"
          else
            ./gradlew assembleRelease --no-daemon
          fi


      # Le Play Store n'accepte QUE des .aab. On produit les deux : l'APK pour
      # l'installation directe et les tests, l'AAB pour la publication.
      - name: Gradle bundle (AAB pour le Play Store)
        if: steps.signing.outputs.signed == 'true'
        working-directory: mobile/android
        env:
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          ./gradlew bundleRelease --no-daemon \
            -PCAMILLE_STORE_FILE=camille-release.keystore \
            -PCAMILLE_STORE_PASSWORD="$STORE_PASSWORD" \
            -PCAMILLE_KEY_ALIAS="${KEY_ALIAS:-camille}" \
            -PCAMILLE_KEY_PASSWORD="${KEY_PASSWORD:-$STORE_PASSWORD}"

      - name: Upload AAB artifact
        if: steps.signing.outputs.signed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: camille-aab
          path: mobile/android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
      # La cle ne doit pas survivre au job, meme en cas d'echec plus loin.
      - name: Effacer la cle
        if: always()
        run: rm -f android/app/camille-release.keystore

      - name: Locate APK
        id: apk
        run: |
          APK=$(find . -path '*/apk/release/*.apk' | head -n1)
          echo "Found APK: $APK"
          echo "path=mobile/$APK" >> "$GITHUB_OUTPUT"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: camille-mobile-apk
          path: mobile/android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30

      # Publie la mise a jour OTA APRES l'upload de l'APK : meme si cette etape
      # echoue (secret absent, reseau), l'APK reste disponible en artifact.
      - name: Publier la mise a jour OTA (EAS Update)
        if: env.EXPO_TOKEN != ''
        continue-on-error: true
        working-directory: mobile
        run: npx eas-cli@latest update --branch production --message "build ${{ github.sha }}" --non-interactive
